name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    env:
      JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-disabled: true

      - name: Create .env File
        run: |
          if [ ! -f ".env" ]; then
            if [ -f ".env.example" ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

      - name: Ensure google-services.json
        run: |
          if [ ! -f "app/google-services.json" ]; then
            echo '{"project_info":{"project_number":"123456789012","project_id":"smartautoreply-app","storage_bucket":"smartautoreply-app.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:123456789012:android:1234567890123456789012","android_client_info":{"package_name":"com.aistudio.smartautoreply.qpwtzn"}},"oauth_client":[],"api_key":[{"current_key":"AIzaSyDummyApiKeyForBuild123456789"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}},{"client_info":{"mobilesdk_app_id":"1:123456789012:android:1234567890123456789013","android_client_info":{"package_name":"com.example"}},"oauth_client":[],"api_key":[{"current_key":"AIzaSyDummyApiKeyForBuild123456789"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}' > app/google-services.json
          fi

      - name: Setup Debug Keystore
        run: |
          if [ -f "debug.keystore.base64" ]; then
            (base64 -d debug.keystore.base64 > debug.keystore) 2>/dev/null || (base64 --decode debug.keystore.base64 > debug.keystore) 2>/dev/null || true
          fi
          if [ ! -s "debug.keystore" ]; then
            echo "Generating fresh debug.keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          echo "debug.keystore ready."

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartAutoReply-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

